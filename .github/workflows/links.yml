name: links

on:
  push:
    branches:
      - main
      - staging
  pull_request:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 18 * * *"

jobs:
  link_checker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Restore wire cache
        uses: actions/cache@v4
        with:
          path: hub/.wire-cache
          key: wire-${{ github.run_id }}
          restore-keys: wire-

      - run: npm ci
      - run: npm run build

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            --verbose --no-progress --cache --max-cache-age 1d
            --base "$PWD/hub/dist"
            'hub/dist/**/*.html'
          fail: true
