name: deploy

on:
  push:
    branches:
      - main
      - staging
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    name: Build and deploy hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://www.ribose.com' || 'https://staging.ribose.com' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - name: Restore wire cache
        uses: actions/cache@v4
        with:
          path: hub/.wire-cache
          key: wire-${{ github.run_id }}
          restore-keys: wire-

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy dist --project-name ribose-com --branch "${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
