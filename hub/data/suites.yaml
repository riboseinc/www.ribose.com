    softwares:
      - { name: tebako, note: "packaging & loading ecosystem (441 stars)" }
      - { name: tebako-runtime, note: "runtime functions" }
      - { name: aibika, note: "Windows Ruby packager" }
      - { name: libtfs, note: "DwarFS access in C++" }
      - { name: tebako-ci-containers, note: "packaging CI images" }
      - { name: tebako-tools, note: "macOS cross-compile" }

  - id: capsium
