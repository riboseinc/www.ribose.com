  - id: omnizip
    name: Omnizip
    domain: infrastructure
    org: omnizip
    site: https://www.omnizip.org
    tagline: Every archive format, one library
    softwares:
      - { name: omnizip, note: "pure-Ruby multi-format archives" }
      - { name: omnizip-rs, note: "pure-Rust codecs" }
      - { name: excavate, note: "nested archive extraction" }
      - { name: cabriolet, note: "Microsoft CAB formats" }

  - id: riffol
    name: Riffol
    domain: infrastructure
    org: riboseinc
    site: "todo: none found"
