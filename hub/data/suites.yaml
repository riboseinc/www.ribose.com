# Ribose portfolio suites. Seeded from GitHub API 2026-08-30; curated: false
# entries await human review. todo: markers need facts only Ribose can confirm.
suites:
  # ---- standards ----
  - id: metanorma
    name: Metanorma
    domain: standards
    org: metanorma
    site: https://www.metanorma.org
    tagline: Standards authoring and publication, any flavor
    powers: [metanorma]
    softwares:
      - { name: metanorma, note: "authoring toolchain (138 stars)" }
      - { name: metanorma-cli, note: "command line interface" }
      - { name: packed-mn, note: "single-binary Metanorma" }
      - { name: coradoc, note: "core AsciiDoc parser" }
      - { name: mn2pdf, note: "Metanorma XML to PDF" }
      - { name: mnconvert, note: "document conversion" }
      - { name: html2doc, note: "HTML to Word" }
      - { name: sts-ruby, note: "NISO STS / ISO STS" }
      - { name: "metanorma-iso, metanorma-ietf, metanorma-iho, metanorma-plateau", note: "SDO flavors" }
      - { name: bipm-data-outcomes, note: "machine-readable BIPM outcomes" }
      - { name: iso-data-open, note: "ISO Open Data pipelines" }
      - { name: iso-10303, note: "STEP (ISO 10303) SRL work" }

  - id: relaton
    name: Relaton
    domain: standards
    org: relaton
    site: https://www.relaton.com
    tagline: Interoperable bibliographic information
    powers: [metanorma]
    softwares:
      - { name: relaton-db, note: "bibliographic database core" }
      - { name: relaton-models, note: "bibliographic models (basicdoc consumer)" }
      - { name: relaton-cli, note: "CLI" }
      - { name: "relaton-iso, relaton-iec, relaton-gb, relaton-oiml, relaton-etsi", note: "SDO adapters" }
      - { name: "relaton-data-*", note: "daily-updated citation datasets per SDO" }

  - id: pubid
    name: PubID
    domain: standards
    org: pubid
    site: https://www.pubid.com
    tagline: Standards publication identifiers
    powers: [metanorma, primmel-digital-cab]
    softwares:
      - { name: pubid-core, note: "core identifier model" }
      - { name: "pubid-iso, pubid-iec, pubid-ieee, pubid-jis, pubid-nist, pubid-bsi, pubid-etsi", note: "SDO identifier implementations" }
      - { name: pubid-testsuite, note: "language-neutral conformance tests" }

  - id: glossarist
    name: Glossarist
    domain: standards
    org: glossarist
    site: https://www.glossarist.org
    tagline: Concept and terminology management
    powers: [metanorma, primmel-digital-cab]
    softwares:
      - { name: glossarist-ruby, note: "concept modeller" }
      - { name: glossarist-js, note: "JS runtime" }
      - { name: glossarist-desktop, note: "desktop app" }
      - { name: concept-model, note: "concept model" }
      - { name: concept-browser, note: "browsing UI" }
      - { name: iev, note: "IEV Electropedia access" }

  - id: konneal
    name: Konneal
    domain: standards
    org: konneal
    site: https://www.konneal.org
    tagline: Knowledge annealment for standards — measurable, citable, executable
    softwares:
      - { name: engine, note: "serving layer: hybrid retrieval, citation-grounded answers, conformance by execution" }
      - { name: client, note: "publisher-site contract with the engine API" }
      - { name: create-publisher, note: "scaffolds a Konneal publisher deployment from a profile interview" }

  - id: geolexica
    name: Geolexica
    domain: standards
    org: geolexica
    site: https://www.geolexica.org
    tagline: Terminology publication for standards bodies
    powers: [metanorma]
    softwares:
      - { name: geolexica-server, note: "generalized backend" }
      - { name: isotc211.geolexica.org, note: "ISO/TC 211 MLGT deployment" }
      - { name: isotc204.geolexica.org, note: "ISO/TC 204 deployment" }
      - { name: breviter, note: "reverse semantic search" }

  - id: atmospheris
    name: Atmospheris
    domain: standards
    org: atmospheris
    site: https://www.atmospheris.org
    tagline: The ISO 2533 / ICAO Standard Atmosphere as code
    softwares:
      - { name: atmospheris, note: "Ruby reference implementation of ISO 2533, ICAO Doc 7488/3, ISO 5878; generates the official ISO 2533 series data tables" }
      - { name: atmospheris-js, note: "JavaScript implementation" }

  # ---- sdo governance ----
  - id: edoxen
    name: Edoxen
    domain: sdo-governance
    org: edoxen
    site: https://edoxen.github.io   # todo: confirm canonical site
    tagline: Resolutions, decisions, and meetings for standards bodies
    powers: [primmel-digital-cab]
    softwares:
      - { name: edoxen-model, note: "resolution modelling" }
      - { name: edoxen, note: "Ruby gem" }
      - { name: edoxen-js, note: "data layer, Astro components, Vue adapter" }
      - { name: meeting-minutes-model, note: "UML model for meeting minutes" }
      - { name: bipm-resolutions, note: "BIPM resolutions deployment" }

  # ---- modelling ----
  - id: lutaml
    name: LutaML
    domain: modelling
    org: lutaml
    site: https://lutaml.github.io   # todo: lutaml.org when live
    tagline: Express and use information models
    powers: [metanorma]
    softwares:
      - { name: lutaml, note: "UML/SysML/EXPRESS data model accessor" }
      - { name: lutaml-model, note: "declarative modelling + serialization framework" }
      - { name: expressir, note: "ISO EXPRESS parser" }
      - { name: express-grammar, note: "ANTLR grammar for EXPRESS" }
      - { name: oscal, note: "OSCAL content gem" }
      - { name: xmi, note: "OMG XMI parser" }
      - { name: lutaml-lml, note: "LML text DSL" }
      - { name: newsmlg2-ruby, note: "IPTC NewsML-G2 (relevant to the news wire)" }
      - { name: moxml, note: "unified XML library interface" }
      - { name: canon, note: "XML/YAML/JSON canonicalization" }

  - id: primmel
    name: Primmel
    domain: modelling
    org: primmel
    site: https://www.primmel.org
    tagline: The executable modelling language for standards
    powers: [primmel-digital-cab]
    softwares:
      - { name: primmel-ts, note: "parser, types, serializer (successor to MMEL)" }
      - { name: editor, note: "browser editor/viewer (successor to Paneron SMART)" }
      - { name: private-models, note: "ISO/BSI/OIML models migrated from MMEL" }
      - { name: spec, note: "language specification" }
      - { name: smartcab, note: "SMART+ component" }

  # ---- language ----
  - id: interscript
    name: Interscript
    domain: language
    org: interscript
    site: https://interscript.com
    tagline: Deterministic, interoperable transliteration
    softwares:
      - { name: interscript-ruby, note: "Ruby runtime" }
      - { name: interscript-ts, note: "canonical JS/TS engine" }
      - { name: maps, note: "transliteration system data" }
      - { name: interscript-ml, note: "ML training framework" }
      - { name: khmer-dict-spice, note: "Khmer Chuon Nath dictionary" }

  - id: secryst
    name: Secryst
    domain: language
    org: secryst
    site: https://secryst.github.io
    tagline: Neural vocalization (G2P) for scripts
    softwares:
      - { name: secryst, note: "seq2seq transformer in Ruby" }
      - { name: secryst-ts, note: "TypeScript crystal" }
      - { name: secryst-py, note: "Python crystal" }
      - { name: "data-khmer-translit, data-thai-interscript, data-arabic-pointing", note: "training data" }

  - id: kotoshu
    name: Kotoshu
    domain: language
    org: kotoshu
    site: https://www.kotoshu.org
    tagline: Spell checking as a service, API, and LSP
    softwares:
      - { name: kotoshu, note: "Ruby spellchecker" }
      - { name: kotoshu-server, note: "HTTP API" }
      - { name: kotoshu-lsp, note: "LSP server" }
      - { name: action-kotoshu, note: "GitHub Action" }
      - { name: "kotoshu-go, kotoshu-python", note: "API clients" }

  # ---- scientific notation ----
  - id: plurimath
    name: Plurimath
    domain: scientific-notation
    org: plurimath
    site: https://www.plurimath.org
    tagline: Interoperable math notation
    powers: [metanorma]
    softwares:
      - { name: plurimath, note: "Ruby engine" }
      - { name: plurimath-js, note: "JS module" }
      - { name: omml2mathml, note: "Office Math to MathML" }
      - { name: mathml2asciimath, note: "MathML to AsciiMath" }
      - { name: latexmath, note: "LaTeX math" }
      - { name: unicode2latex, note: "Unicode to LaTeX escapes" }

  - id: asciichem
    name: AsciiChem
    domain: scientific-notation
    org: asciichem
    site: https://asciichem.github.io
    tagline: ASCII syntax for chemistry, as AsciiMath is for math
    softwares:
      - { name: asciichem-ruby, note: "atoms, molecules, bonds, reactions, electron configurations parsed to a semantic model; renders MathML, HTML, LaTeX, SVG" }

  # ---- fonts ----
  - id: fontist
    name: Fontist
    domain: fonts
    org: fontist
    site: https://www.fontist.org
    tagline: Install openly-licensed fonts on any OS
    powers: [metanorma]
    softwares:
      - { name: fontist, note: "CLI (43 stars)" }
      - { name: formulas, note: "font formulas" }
      - { name: fontisan, note: "font utilities" }
      - { name: setup-fontist, note: "GitHub Action" }
      - { name: extract_ttc, note: "TTC extraction" }

  - id: metfont
    name: MetFont
    domain: fonts
    org: metfont
    site: https://metfont.github.io
    tagline: Meteorological symbols font (OGC/WMO)
    softwares:
      - { name: metfont, note: "weather/meteorology symbol font from OGC/WMO" }

  - id: essenfont
    name: Essenfont
    domain: fonts
    org: essenfont
    site: https://essenfont.github.io
    tagline: Universal Unicode 17 font, one glyph per codepoint
    softwares:
      - { name: essenfont, note: "donor-derived universal font" }

  # ---- data ----
  - id: paneron
    name: Paneron
    domain: data
    org: paneron
    site: https://www.paneron.org
    tagline: Interactive information registers
    softwares:
      - { name: paneron, note: "host application" }
      - { name: registry-kit, note: "ISO 1913x registry foundation" }
      - { name: extension-kit, note: "extension library" }
      - { name: ms-kit, note: "management systems kit" }
      - { name: extension-geodetic-registry, note: "ISO Geodetic Registry" }

  - id: leptris
    name: Leptris
    domain: data
    org: leptris
    site: https://www.leptris.org
    tagline: XML, TOML & YAML at library speed
    softwares:
      - { name: leptris, note: "C99 XML 1.0 + XPath 1.0 engine" }
      - { name: teptris, note: "TOML 1.0 parser/writer in C11" }
      - { name: yeptris, note: "YAML 1.2 parser/writer/streamer in C11" }
      - { name: leptris-ruby, note: "Ruby bindings" }
      - { name: teptris-ruby, note: "Ruby bindings" }
      - { name: yeptris-ruby, note: "Ruby bindings" }
      - { name: leptris-py, note: "Python bindings" }
      - { name: teptris-py, note: "Python bindings" }
      - { name: yeptris-py, note: "Python bindings" }

  - id: parsanol
