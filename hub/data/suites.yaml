    tagline: Parser combinators
    softwares:
      - { name: parsanol-ruby, note: "Ruby" }
      - { name: parsanol-rs, note: "Rust" }

  # ---- graphics & layout ----
  - id: claricle
    name: Claricle
    domain: graphics-layout
    org: claricle
    site: https://www.claricle.org
    tagline: Vector graphics conformance and conversion for publication
    powers: [metanorma]   # todo: confirm
    softwares:
      - { name: vectory, note: "vector format conversion" }
      - { name: svg_conform, note: "SVG conformance validation" }
      - { name: png_conform, note: "PNG conformance" }
      - { name: emf2svg-ruby, note: "EMF to SVG" }
      - { name: postsvg, note: "PS/EPS to SVG" }
      - { name: sirena, note: "PlantUML/Mermaid diagramming" }
      - { name: elkrb, note: "Eclipse Layout Kernel in Ruby" }
      - { name: pdfrb, note: "PDF in Ruby" }

  - id: arrolio
    name: Arrolio
    domain: graphics-layout
    org: arrolio
    site: "todo: none found"
    tagline: Layout engine with its own language, independent of output backend
    softwares:
      - { name: arrolio, note: "layout language + engine over PDF, HTML/CSS, and other backends" }

  # ---- infrastructure ----
  - id: serialbench
    name: Serialbench
    domain: infrastructure
    org: serialbench
    site: https://serialbench.github.io
    tagline: Ruby serialization library performance benchmarker
    softwares:
      - { name: serialbench, note: "benchmark suite: XML, JSON, YAML, TOML" }
      - { name: data, note: "append-only benchmark results" }

  - id: tebako
