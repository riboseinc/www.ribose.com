  - id: retrace
    name: Retrace
    domain: security-compliance
    org: riboseinc
    site: "todo: none found"
    tagline: Security vulnerability and bug discovery through behavior monitoring
    softwares:
      - { name: retrace, note: "69 stars" }

  - id: bacman
    name: Bacman
    domain: security-compliance
    org: riboseinc
    site: "todo: none found"
    tagline: UI tool for ISO 22301 business continuity management
    softwares:
