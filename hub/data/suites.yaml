  # ---- security & compliance ----
  - id: rnp
    name: RNP
    domain: security-compliance
    org: rnpgp
    site: https://www.rnpgp.org
    tagline: High-performance OpenPGP, used by Mozilla Thunderbird
    powers: [primmel-digital-cab]   # todo: confirm (eSignatures)
    softwares:
      - { name: rnp, note: "C++ OpenPGP library (247 stars)" }
      - { name: sexpp, note: "S-expressions library" }
      - { name: rnp-wasm, note: "WASM build + TS bindings" }
      - { name: "ruby-rnp, py-rnp, php-rnp", note: "language bindings" }

  - id: confium
    name: Confium
    domain: security-compliance
    org: confium
    site: https://www.confium.org
    tagline: Multi-stakeholder threshold cryptography
    uses: [rnp]
    softwares:
      - { name: confium, note: "framework, NIST MPTS reference" }
      - { name: confium-plugin-botan, note: "Botan plugin" }
      - { name: confium-ruby, note: "FFI bindings" }
      - { name: terraform-confium, note: "deployment modules" }

  - id: engyon
    name: Engyon
    domain: security-compliance
    org: engyon
    site: https://engyon.github.io
    tagline: Document confidentiality and provenance for collaborative text
    uses: [confium]   # RSD 12001 trust stack; threshold/HSM custody via Confium (integration in progress)
    softwares:
      - { name: enprot, note: "Rust CLI implementing RSD 12001: word-level encryption, multi-level classification, chain anchors, PQ signatures (ML-DSA, ML-KEM)" }
      - { name: rsd-engyon-syntax, note: "the Engyon Protected Text specification (RSD 12001)" }

  - id: ammitto
    name: Ammitto
    domain: security-compliance
    org: ammitto
    site: "todo: none found"
    tagline: Sanction screening from published sources
    softwares:
