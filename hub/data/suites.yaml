      - { name: "data-us, data-eu, data-un, data-wb, data-ch, data-au", note: "source datasets (US/EU/UN/World Bank/SECO/DFAT)" }
      - { name: adapters, note: "source adapters" }

  - id: cryptode
    name: Cryptode
    domain: security-compliance
