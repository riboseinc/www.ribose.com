# Registry of sites in the Ribose news network.
# `distribution` values on wire items reference `id` here.
# type: hub (corporate) | product | program (client deployment) | project
sites:
  - id: ribose-com
    name: Ribose
    url: https://www.ribose.com
    type: hub
    news_path: /news/
  - id: metanorma-org
    name: Metanorma
    url: https://www.metanorma.org
    type: project
    news_path: /blog/
    # Static NewsML-G2 spoke feed (TODO.import-network/03); the hub pulls
    # this index and imports full articles at build time.
    newsml: https://www.metanorma.org/news-data/newsml.xml
  - id: primmel
    name: Primmel
    url: https://www.primmel.org
    type: product
    news_path: /blog/
  - id: oimlsmart-org
    name: OIML SMART
    url: https://www.oimlsmart.org
    type: program
    news_path: /news/
  - id: lutaml
    name: LutaML
    url: https://lutaml.github.io
    type: project
    news_path: /blog/
  - id: pubid-com
    name: PubID
    url: https://www.pubid.com
    type: project
    news_path: /blog/
    # Static NewsML-G2 spoke feed (TODO.import-network/03); the hub pulls
    # this index and imports full articles at build time.
    newsml: https://www.pubid.com/news-data/newsml.xml
  - id: leptris-org
    name: Leptris
    url: https://www.leptris.org
    type: project
    news_path: /blog/
    # Static NewsML-G2 spoke feed; the hub pulls this index and imports
    # full articles at build time.
    newsml: https://www.leptris.org/news-data/newsml.xml
